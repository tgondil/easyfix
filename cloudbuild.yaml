steps:
  # Install dependencies
  - name: 'node:20'
    entrypoint: npm
    args: ['install']
    
  # Build the application
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']
    
  # Deploy to App Engine
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args: ['-c', 'gcloud app deploy --quiet']
    
timeout: '1600s' 