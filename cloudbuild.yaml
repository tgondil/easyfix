steps:
  # Install dependencies
  - name: 'node:20'
    entrypoint: npm
    args: ['install']
    
  # Build the application
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']
    
  # Deploy to App Engine
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args: ['-c', 'gcloud app deploy --quiet']
    
timeout: '1600s'

# Add substitutions section to handle environment variables
substitutions:
  _MONGODB_URI: ${_MONGODB_URI}

# Access the Secret Manager secret
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/mongodb-uri/versions/latest
      env: '_MONGODB_URI' 